name: Rust

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: rust:latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo make -e BUILDSYS_VARIANT=aws-k8s-1.32
    - name: Run tests
      run: cargo test --verbose
